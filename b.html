<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B · Как должно быть</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#f4f4f2;font:14px -apple-system,Helvetica,Arial}
#bar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#111;z-index:2}
#bar a{color:#bbb;text-decoration:none;padding:7px 11px;border-radius:7px}#bar a.on{background:#fff;color:#111;font-weight:600}
#bar .sp{flex:1}#bar button{background:#333;color:#fff;border:0;border-radius:7px;padding:7px 11px;font-size:14px;cursor:pointer}
#v{position:fixed;top:46px;left:0;right:0;bottom:0;cursor:grab;touch-action:none}#v.d{cursor:grabbing}
#g{transform-origin:0 0;position:absolute;top:0;left:0}#g img{display:block}
#h{position:fixed;bottom:10px;left:10px;background:#000a;color:#fff;padding:6px 10px;border-radius:7px;font-size:12px}
</style></head><body><div id="bar"><a href="b.html" id="nb">B · Как должно быть</a><span class="sp"></span><button onclick="zm(1.25)">＋</button><button onclick="zm(0.8)">－</button><button onclick="fit()">По экрану</button><a href="to_be.svg" download>SVG</a></div>
<div id="v"><div id="g"><img id="i" src="to_be.svg"></div></div><div id="h">Тачпад: два пальца — двигать, щипок — масштаб · мышь: тянуть, Ctrl+колесо — масштаб · двойной клик — приблизить</div>
<script>
document.getElementById('nb').className='on';
const v=document.getElementById('v'),g=document.getElementById('g'),im=document.getElementById('i');let s=1,x=0,y=0;
function ap(){g.style.transform=`translate(${x}px,${y}px) scale(${s})`}
function fit(){const W=im.naturalWidth,H=im.naturalHeight;im.style.width=W+'px';s=Math.min(v.clientWidth/W,v.clientHeight/H)*0.98;x=(v.clientWidth-W*s)/2;y=(v.clientHeight-H*s)/2;ap()}
function zat(f,cx,cy){const n=Math.min(8,Math.max(0.05,s*f));f=n/s;x=cx-(cx-x)*f;y=cy-(cy-y)*f;s=n;ap()}
function zm(f){zat(f,v.clientWidth/2,v.clientHeight/2)}
im.complete?fit():im.onload=fit;addEventListener('resize',fit);
v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();
 if(e.ctrlKey||e.metaKey)zat(Math.exp(-e.deltaY*0.01),e.clientX-r.left,e.clientY-r.top);
 else{x-=e.deltaX;y-=e.deltaY;ap()}},{passive:false});
let P=new Map(),ld=0;
v.addEventListener('pointerdown',e=>{v.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);v.classList.add('d')});
v.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(ld)zat(d/ld,(a[0]+b[0])/2,(a[1]+b[1])/2-46);ld=d}else{x+=e.clientX-o[0];y+=e.clientY-o[1];ap()}});
const up=e=>{P.delete(e.pointerId);ld=0;if(!P.size)v.classList.remove('d')};v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
v.addEventListener('dblclick',e=>{const r=v.getBoundingClientRect();zat(2,e.clientX-r.left,e.clientY-r.top)});
addEventListener('gesturestart',e=>e.preventDefault());
</script></body></html>
